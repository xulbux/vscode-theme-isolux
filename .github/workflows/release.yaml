# Creates a GitHub release with the .vsix attached whenever a version tag is pushed.
# Usage: git tag v1.2.3 && git push origin v1.2.3

name: Release
permissions:
  contents: write

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate
        run: pnpm run type-check && pnpm run lint:check && pnpm run fmt:check && pnpm run test

      # `vsce package` runs `vscode:prepublish`, which builds the themes in strict mode.
      - name: Package
        run: pnpm dlx @vscode/vsce package

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            theme-isolux-*.vsix
